<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850"><rect width="1240" height="850" rx="12" fill="#f3f6f8"/><style>text{font-family:Arial,sans-serif;fill:#162941}.h{font-size:24px;font-weight:bold}.t{font-size:17px;font-weight:bold}.s{font-size:14px;fill:#526577}.b{fill:white;stroke:#c6d5df;stroke-width:1.5}.l{stroke:#70869a;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#70869a"/></marker></defs><text x="26" y="36" class="h">Implemented data model | PostgreSQL / PostGIS (ma41)</text><text x="26" y="60" class="s">Arrows: parent to child (one to zero or many). Separate dataset and tenant groups; no invented foreign key.</text><rect x="30" y="100" width="350" height="94" rx="8" class="b"/><rect x="30" y="100" width="350" height="34" rx="8" fill="#e5f1ef"/><text x="44" y="123" class="t">organizations</text><text x="44" y="155" class="s">PK id</text><text x="44" y="179" class="s">name</text><rect x="30" y="300" width="350" height="118" rx="8" class="b"/><rect x="30" y="300" width="350" height="34" rx="8" fill="#e5f1ef"/><text x="44" y="323" class="t">credentials</text><text x="44" y="355" class="s">PK id</text><text x="44" y="379" class="s">FK org_id → organizations</text><text x="44" y="403" class="s">label, role, token_hash (unique), revoked</text><rect x="440" y="100" width="350" height="118" rx="8" class="b"/><rect x="440" y="100" width="350" height="34" rx="8" fill="#e5f1ef"/><text x="454" y="123" class="t">projects</text><text x="454" y="155" class="s">PK (org_id, id)</text><text x="454" y="179" class="s">FK org_id → organizations</text><text x="454" y="203" class="s">name, client, plan, created</text><rect x="440" y="300" width="350" height="118" rx="8" class="b"/><rect x="440" y="300" width="350" height="34" rx="8" fill="#e5f1ef"/><text x="454" y="323" class="t">runs</text><text x="454" y="355" class="s">PK (org_id, project_id, id)</text><text x="454" y="379" class="s">FK (org_id, project_id) → projects</text><text x="454" y="403" class="s">created, payload, sha256</text><rect x="850" y="100" width="360" height="94" rx="8" class="b"/><rect x="850" y="100" width="360" height="34" rx="8" fill="#e5f1ef"/><text x="864" y="123" class="t">datasets</text><text x="864" y="155" class="s">PK id (SHA-256 identifier)</text><text x="864" y="179" class="s">report, imported_at</text><rect x="850" y="300" width="360" height="142" rx="8" class="b"/><rect x="850" y="300" width="360" height="34" rx="8" fill="#e5f1ef"/><text x="864" y="323" class="t">facilities</text><text x="864" y="355" class="s">PK (dataset_id, industry, osm_id)</text><text x="864" y="379" class="s">FK dataset_id → datasets</text><text x="864" y="403" class="s">district, longitude, latitude, payload</text><text x="864" y="427" class="s">generated geography(Point,4326) · GiST</text><rect x="850" y="520" width="360" height="118" rx="8" class="b"/><rect x="850" y="520" width="360" height="34" rx="8" fill="#e5f1ef"/><text x="864" y="543" class="t">coverage</text><text x="864" y="575" class="s">PK (dataset_id, industry, district, radius_m)</text><text x="864" y="599" class="s">FK dataset_id → datasets</text><text x="864" y="623" class="s">payload · radii 1000 / 3000 / 5000 m</text><path d="M205 194V296" class="l"/><path d="M380 145H436" class="l"/><path d="M615 218V296" class="l"/><path d="M1030 194V296" class="l"/><path d="M1210 145H1226V560H1214" class="l"/><text x="30" y="495" class="h">Local SQLite workflow (separate database)</text><rect x="30" y="525" width="350" height="118" rx="8" class="b"/><rect x="30" y="525" width="350" height="34" rx="8" fill="#e5f1ef"/><text x="44" y="548" class="t">projects</text><text x="44" y="580" class="s">PK id</text><text x="44" y="604" class="s">name, client, notes, status, plan</text><text x="44" y="628" class="s">created, updated</text><rect x="440" y="525" width="350" height="94" rx="8" class="b"/><rect x="440" y="525" width="350" height="34" rx="8" fill="#e5f1ef"/><text x="454" y="548" class="t">runs</text><text x="454" y="580" class="s">PK id; FK project_id → projects</text><text x="454" y="604" class="s">created, payload, sha256</text><rect x="440" y="697" width="350" height="94" rx="8" class="b"/><rect x="440" y="697" width="350" height="34" rx="8" fill="#e5f1ef"/><text x="454" y="720" class="t">workflow_events</text><text x="454" y="752" class="s">PK seq; unique id; FK run_id → runs</text><text x="454" y="776" class="s">payload, sha256</text><path d="M380 574H436" class="l"/><path d="M615 619V693" class="l"/><text x="30" y="710" class="s">Review events are hash-chained,</text><text x="30" y="731" class="s">not externally signed audit records.</text><text x="30" y="782" class="s">No cross-database foreign keys or dual-write.</text></svg>