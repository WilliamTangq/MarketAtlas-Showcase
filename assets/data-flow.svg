<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="330" viewBox="0 0 1240 330"><rect width="1240" height="330" rx="12" fill="#f3f6f8"/><style>text{font-family:Arial,sans-serif;fill:#162941}.t{font-size:19px;font-weight:bold}.s{font-size:14px;fill:#526577}</style><text x="30" y="42" font-size="24" font-weight="bold">Data lineage and decision workflow</text><rect x="30" y="80" width="216" height="148" rx="10" fill="white" stroke="#c6d5df"/><text x="46" y="110" font-size="15" fill="#176e66">01</text><text x="46" y="143" class="t">Define</text><text x="46" y="173" class="s">Industry / district</text><text x="46" y="195" class="s">radius / unit</text><path d="M249 154h17l-5 -5m5 5l-5 5" stroke="#70869a" stroke-width="2" fill="none"/><rect x="271" y="80" width="216" height="148" rx="10" fill="white" stroke="#c6d5df"/><text x="287" y="110" font-size="15" fill="#176e66">02</text><text x="287" y="143" class="t">Acquire</text><text x="287" y="173" class="s">Dated source files</text><text x="287" y="195" class="s">raw hashes</text><path d="M490 154h17l-5 -5m5 5l-5 5" stroke="#70869a" stroke-width="2" fill="none"/><rect x="512" y="80" width="216" height="148" rx="10" fill="white" stroke="#c6d5df"/><text x="528" y="110" font-size="15" fill="#176e66">03</text><text x="528" y="143" class="t">Validate</text><text x="528" y="173" class="s">Geometry / tags</text><text x="528" y="195" class="s">duplicate review</text><path d="M731 154h17l-5 -5m5 5l-5 5" stroke="#70869a" stroke-width="2" fill="none"/><rect x="753" y="80" width="216" height="148" rx="10" fill="white" stroke="#c6d5df"/><text x="769" y="110" font-size="15" fill="#176e66">04</text><text x="769" y="143" class="t">Analyse</text><text x="769" y="173" class="s">Spatial join / KD-tree</text><text x="769" y="195" class="s">coverage / scenarios</text><path d="M972 154h17l-5 -5m5 5l-5 5" stroke="#70869a" stroke-width="2" fill="none"/><rect x="994" y="80" width="216" height="148" rx="10" fill="white" stroke="#c6d5df"/><text x="1010" y="110" font-size="15" fill="#176e66">05</text><text x="1010" y="143" class="t">Deliver</text><text x="1010" y="173" class="s">Evidence snapshot</text><text x="1010" y="195" class="s">dashboard / report</text><text x="30" y="272" class="s">Preserve source vintage and provenance throughout. Revalidate inputs before a new research run.</text><text x="30" y="295" class="s">Review flags are not confirmed duplicates; candidate priority is not investment feasibility.</text></svg>